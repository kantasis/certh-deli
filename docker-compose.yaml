   grafana_label:
      image: grafana/grafana:11.5.2
      container_name: ${PROJECT_NAME}_grafana_container
      user: "472:472"
      env_file:
         - ./services/grafana/.env
      ports:
         - "${HOST_GRAFANA_PORT}:3000"
      restart: ${RESTART_POLICY}
      volumes:
         - ./shared/grafana:/var/lib/grafana
         - ./app-grafana:${GLOBAL_GF_PATHS_PROVISIONING}
      networks:
         - main_network
      depends_on:
         - db_label


   db_label:
      image: postgres:17
      container_name: ${PROJECT_NAME}_db_container
      build:
         context: ./services/postgres
      env_file:
         - ./services/postgres/.env
      restart: ${RESTART_POLICY}
      volumes:
         - ./shared/data:${GLOBAL_PGDATA}
      networks:
         - main_network

   node_label:
      image: ${PROJECT_NAME}_node_image
      container_name: ${PROJECT_NAME}_node_container
      build:
         context: ./services/node
      env_file:
         - ./services/node/.env
      ports:
         - ${HOST_NODE_PORT}:${NODE_PORT}
      restart: ${RESTART_POLICY}
      volumes: 
         - ./app-react:/app-react
      networks:
         - main_network

   spring_label:
      image: ${PROJECT_NAME}_spring_image
      container_name: ${PROJECT_NAME}_spring_container
      build:
         context: ./services/spring
      env_file:
         - ./services/spring/.env
      environment:
         JWT_SECRET: ${JWT_SECRET}
      ports:
         - ${HOST_SPRING_PORT}:${SPRING_PORT}
      restart: ${RESTART_POLICY}
      volumes: 
         - ./shared/tomcat-logs:/tomcat/logs
         - ./shared/spring-logs:/spring/logs
         - ./app-spring:/app-spring
      networks:
         - main_network
      depends_on:
         - db_label

   express_label:
         build:
            context: ./services/express
         container_name: ${PROJECT_NAME}_express_container
         ports:
            - 8435:9080
         # env_file:
         #    - ./services/express/.env
         restart: ${RESTART_POLICY}
         volumes:
            - ./services/express:/app
         networks:
            - main_network
         depends_on:
            - db_label  # Wait for DB service to be ready
         environment:
            DB_HOST: db_label
            DB_PORT: ${GLOBAL_PGPORT}
            DB_USER: ${GLOBAL_POSTGRES_USER}
            DB_PASSWORD: ${GLOBAL_POSTGRES_PASSWORD}
            DB_NAME: ${GLOBAL_POSTGRES_DB}
            JWT_SECRET: ${JWT_SECRET}